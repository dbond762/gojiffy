{{define "content"}}
{{template "notice" .Data.Notice}}
<div class="rounded-2xl border border-gray-200 bg-white">
	<div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 px-5 py-4">
		<h3 class="text-theme-xl font-semibold text-gray-800">{{.Data.Title}}</h3>
		{{with .Data.New}}<a class="btn btn-primary" href="{{.Href}}">{{.Title}}</a>{{end}}
	</div>
	{{template "table" .Data.Table}}
	{{template "list-footer" .Data.Footer}}
</div>
{{end}}
